name: Release APK

# Push a tag like v1.14 to cut a release, or run it manually from the
# Actions tab and supply a tag name.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create the release under (e.g. v1.14)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/lowdistraction-${{ github.event.inputs.tag || github.ref_name }}.apk

      # Use the Fastlane changelog for this versionCode as the release notes,
      # so every release states exactly what changed.
      - name: Read changelog
        id: changelog
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [ -f "$FILE" ]; then
            {
              echo 'body<<CHANGELOG_EOF'
              cat "$FILE"
              echo 'CHANGELOG_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo 'body=' >> "$GITHUB_OUTPUT"
          fi

      # A tag can trigger this workflow more than once, and this repository's
      # releases are immutable — so a second run cannot replace the asset and
      # would fail with "Cannot delete asset from an immutable release".
      # If the release is already out, there is nothing to do: exit cleanly.
      - name: Check whether this release already exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists — nothing to publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}
          files: dist/*.apk
