name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The logging standard is a review gate, not a suggestion: an event that is
      # not in tools/logging_schema.json, a missing required property, an unknown
      # property, a wrong log level or a drifted enum fails the build here.
      - name: Validate the logging schema
        run: python3 tools/validate_logging.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Pin the packages we need explicitly.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Decode signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The pure half of the logging pipeline: the JSON/CSV/markdown encodings,
      # the redaction rules, the report renderers and the zip.
      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lowdistraction-release
          path: app/build/outputs/apk/release/app-release.apk
