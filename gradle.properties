# Keep memory modest for on-device (Termux) builds.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# NOTE: On Termux/aarch64 you must ALSO point Gradle at the arm64 aapt2.
# Do NOT put that here (the path is machine-specific). Put it in your
# user-level config instead, e.g. ~/.gradle/gradle.properties:
#   android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
